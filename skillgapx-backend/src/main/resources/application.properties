# ============================================================
# SkillGapX – Spring Boot Application Properties
# Default Profile: H2 In-Memory Database (No Installation Needed)
# ============================================================

# Server Configuration
server.port=8081
spring.application.name=SkillGapX

# ======================== H2 Database (Default) ========================
# H2 in-memory database for local development and project demo
spring.datasource.url=jdbc:h2:mem:skillgapxdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ======================== JPA / Hibernate ========================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ======================== Data Initialization ========================
# Load seed data from data.sql on startup
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ======================== JWT Configuration ========================
# Secret key for signing JWT tokens (change in production!)
jwt.secret=SkillGapXSecretKey2026MCAProjectSecureTokenSigningKeyAtLeast256Bits
jwt.expiration=86400000

# ======================== API Base Path ========================
server.servlet.context-path=/api

# ======================== Logging ========================
logging.level.com.skillgapx=DEBUG
logging.level.org.springframework.security=INFO
