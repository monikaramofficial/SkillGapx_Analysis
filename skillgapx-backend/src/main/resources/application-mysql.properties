# ============================================================
# SkillGapX – MySQL Profile Properties
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# ============================================================

# MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/skillgapxdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Disable H2 Console when using MySQL
spring.h2.console.enabled=false
